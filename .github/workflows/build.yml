name: build

# GitHub の Actions 画面で「Run workflow」を押したときだけビルドする
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 前回のビルド結果（パッケージの取得と、変えていない部分のコンパイル）を使い回して、ビルド時間を短くする
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: deriv-${{ github.run_id }}
          restore-keys: |
            deriv-

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project DuoFlick.xcodeproj \
            -scheme DuoFlick \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          PRODUCTS=build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R "$PRODUCTS/DuoFlick.app" Payload/
          # パッケージ由来の動的ライブラリ（llama.cpp など）を、キーボードが読み込めるようアプリに同梱する
          mkdir -p Payload/DuoFlick.app/Frameworks
          for fw in "$PRODUCTS"/*.framework "$PRODUCTS"/PackageFrameworks/*.framework; do
            [ -e "$fw" ] || continue
            echo "embed: $fw"
            cp -R "$fw" Payload/DuoFlick.app/Frameworks/
          done
          rmdir Payload/DuoFlick.app/Frameworks 2>/dev/null || true
          # 辞書には日本語のファイル名（キ.louds など）があるため、ファイル名を UTF-8 と明示した zip にする。
          # 印のない zip だと、Windows の Sideloadly で展開したときに名前が文字化けし、辞書が読めなくなる。
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("DuoFlick.ipa", "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("Payload"):
                  for f in files:
                      p = os.path.join(root, f)
                      info = zipfile.ZipInfo.from_file(p, p)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      with open(p, "rb") as fh:
                          z.writestr(info, fh.read())
          with zipfile.ZipFile("DuoFlick.ipa") as z:
              names = [i for i in z.infolist() if "louds/キ.louds" in i.filename]
              print("check:", [(i.filename, hex(i.flag_bits)) for i in names])
          PY

      - name: Show bundle contents
        run: |
          APPEX=Payload/DuoFlick.app/PlugIns/DuoFlickKeyboard.appex
          du -sh Payload/DuoFlick.app "$APPEX" || true
          ls -la "$APPEX" || true
          # SKK 辞書（SkkDict）がキーボードに入っていなければ失敗させる
          test -f "$APPEX/SkkDict/user.louds" && test -f "$APPEX/SkkDict/user0.loudstxt3" || { echo "SkkDict がありません"; exit 1; }
          echo "SkkDict files: $(ls "$APPEX/SkkDict" | wc -l)"
          ls "$APPEX"/Frameworks 2>/dev/null || echo "no Frameworks in appex"
          ls Payload/DuoFlick.app/Frameworks 2>/dev/null || echo "no Frameworks in app"
          otool -L "$APPEX/DuoFlickKeyboard" | head -40 || true
          otool -l "$APPEX/DuoFlickKeyboard" | grep -A2 LC_RPATH || true
          DICT="$APPEX/AzooKeyKanakanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary"
          echo "== Dictionary =="; ls "$DICT" || true
          echo "== louds count =="; ls "$DICT/louds" | wc -l
          echo "== louds sample =="; ls "$DICT/louds" | head -15
          echo "== ki =="; ls "$DICT/louds" | grep -i "キ\|30AD" | head -5 || true
          echo "== submodule revision =="
          cat build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter/.gitmodules 2>/dev/null || true
          git -C build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter submodule status 2>/dev/null || true
          git -C build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter log --oneline -1 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: DuoFlick-ipa
          path: DuoFlick.ipa
          retention-days: 14
