name: build

# GitHub の Actions 画面で「Run workflow」を押したときだけビルドする
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project DuoFlick.xcodeproj \
            -scheme DuoFlick \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          PRODUCTS=build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R "$PRODUCTS/DuoFlick.app" Payload/
          # パッケージ由来の動的ライブラリ（llama.cpp など）を、キーボードが読み込めるようアプリに同梱する
          mkdir -p Payload/DuoFlick.app/Frameworks
          for fw in "$PRODUCTS"/*.framework "$PRODUCTS"/PackageFrameworks/*.framework; do
            [ -e "$fw" ] || continue
            echo "embed: $fw"
            cp -R "$fw" Payload/DuoFlick.app/Frameworks/
          done
          rmdir Payload/DuoFlick.app/Frameworks 2>/dev/null || true
          zip -qry DuoFlick.ipa Payload

      - name: Show bundle contents
        run: |
          APPEX=Payload/DuoFlick.app/PlugIns/DuoFlickKeyboard.appex
          du -sh Payload/DuoFlick.app "$APPEX" || true
          ls -la "$APPEX" || true
          ls "$APPEX"/Frameworks 2>/dev/null || echo "no Frameworks in appex"
          ls Payload/DuoFlick.app/Frameworks 2>/dev/null || echo "no Frameworks in app"
          otool -L "$APPEX/DuoFlickKeyboard" | head -40 || true
          otool -l "$APPEX/DuoFlickKeyboard" | grep -A2 LC_RPATH || true
          DICT="$APPEX/AzooKeyKanakanjiConverter_KanaKanjiConverterModuleWithDefaultDictionary.bundle/Dictionary"
          echo "== Dictionary =="; ls "$DICT" || true
          echo "== louds count =="; ls "$DICT/louds" | wc -l
          echo "== louds sample =="; ls "$DICT/louds" | head -15
          echo "== ki =="; ls "$DICT/louds" | grep -i "キ\|30AD" | head -5 || true
          echo "== submodule revision =="
          cat build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter/.gitmodules 2>/dev/null || true
          git -C build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter submodule status 2>/dev/null || true
          git -C build/SourcePackages/checkouts/AzooKeyKanaKanjiConverter log --oneline -1 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: DuoFlick-ipa
          path: DuoFlick.ipa
          retention-days: 14
