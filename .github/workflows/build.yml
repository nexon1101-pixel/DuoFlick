name: build

# GitHub の Actions 画面で「Run workflow」を押したときだけビルドする
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project DuoFlick.xcodeproj \
            -scheme DuoFlick \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DuoFlick.app Payload/
          zip -qry DuoFlick.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DuoFlick-ipa
          path: DuoFlick.ipa
          retention-days: 14
