name: DuoFlick
options:
  bundleIdPrefix: jp.wataru
  deploymentTarget:
    iOS: "17.0"
packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    revision: 3f93209534c148a563d92ef77059953b51777266  # v0.9
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "21"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DuoFlick:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DuoFlick
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.wataru.duoflick
    dependencies:
      - target: DuoFlickKeyboard
  DuoFlickKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: DuoFlick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.wataru.duoflick.keyboard
